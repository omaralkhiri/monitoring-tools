presets:
  logsCollection:
    enabled: true
    logLevel: "info"
    logFormat: "json"
    logOutput: "stdout"
    logRetentionDays: 7
    logRotationSizeMB: 100
    logRotationFrequency: "daily"
    logRotationMaxFiles: 5
    logRotationCompress: true
    logRotationDateFormat: "2006-01-02"
    logRotationTimeZone: "UTC"
    logRotationIncludePodName: true
    logRotationIncludeNamespace: true
    logRotationIncludeContainerName: true
    logRotationIncludeNodeName: true
    logRotationIncludeClusterName: true
    logRotationIncludeLabels: true
    logRotationIncludeAnnotations: true
    logRotationIncludeTimestamps: true
    logRotationIncludeHostnames: true
    logRotationIncludeIPs: true
    logRotationIncludePodUID: true
    logRotationIncludeContainerID: true
    logRotationIncludeNodeUID: true
    logRotationIncludeClusterUID: true
    logRotationIncludeResourceVersion: true
    logRotationIncludeGeneration: true
    logRotationIncludeOwnerReferences: true
    logRotationIncludeFinalizers: true

# Add this section - configure where to send the logs
otelCollector:
  enabled: true
  
  config:
    exporters:
      # Option A: For testing (logs to console only)
      logging:
        logLevel: debug
      
      # Option B: For SigNoz Cloud (uncomment and configure)
      # otlp:
      #   endpoint: "https://ingest.signoz.cloud:443"
      #   headers:
      #     "signoz-access-token": "${SIGNOZ_API_KEY}"
    
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]  # Change to [otlp] when using SigNoz backend
  
  # Environment variables
  extraEnvs:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://signoz-otel-collector.monitoring.svc.cluster.local:4317"
    - name: SIGNOZ_API_KEY
      valueFrom:
        secretKeyRef:
          name: signoz-api-secret
          key: signoz_api_key