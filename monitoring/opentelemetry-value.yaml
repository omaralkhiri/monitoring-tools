default:
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: cumulative
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: 'service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version={{ .Chart.appVersion }}'
    - name: OTEL_COLLECTOR_NAME
      value: signoz-otel-collector.monitoring.svc.cluster.local
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      # OTLP gRPC default port is 4317; use host:port or URL as needed
      value: signoz-otel-collector.monitoring.svc.cluster.local:4317
    - name: SIGNOZ_API_KEY
      valueFrom:
        secretKeyRef:
          name: signoz-api-secret
          key: signoz_api_key